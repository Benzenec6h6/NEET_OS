[package]
name = "neet-helper"
version.workspace = true
edition.workspace = true

[[bin]]
name = "neet"
path = "src/main.rs"

[dependencies]
neet-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
nix = { workspace = true, features = ["user"] } 
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
colored = "2.1"
