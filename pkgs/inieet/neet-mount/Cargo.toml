[package]
name = "neet-mount"
version = "0.1.0"
edition = "2021"

[dependencies]
nix = { version = "0.31.3", features = ["fs", "mount"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[[bin]]
name = "stage1-mount"
path = "src/bin/stage1-mount.rs"

[lib]
name = "neet_mount"
path = "src/lib.rs"
