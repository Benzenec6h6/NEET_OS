name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: your-cachix-cache-name
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
        continue-on-error: true

      # 1. Nix 側のテスト・OS検証・Rustフォーマットを実行してサマリーを出力
      - name: Run CI checks & Summary Report
        run: |
          report_dir=$(nix build .#checks.x86_64-linux.report --no-link --print-out-paths)
          cat "$report_dir/report.md" >> $GITHUB_STEP_SUMMARY

          if [ -f "$report_dir/failed" ]; then
            echo "CI checks failed. Please see the summary above."
            exit 1
          fi

      # 2. Rust の重複コード検査 (npx 経由で即実行)
      # 重複が見つかった場合は exit 1 で CI が落ちます
      - name: Check Rust Duplications (jscpd)
        run: |
          npx jscpd pkgs/inieet \
            --pattern "**/*.rs" \
            --min-tokens 40 \
            --threshold 0

      - name: statix
        run: nix run nixpkgs#statix -- check . || true

      - name: deadnix
        run: nix run nixpkgs#deadnix -- --fail . || true
