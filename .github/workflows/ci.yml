name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: your-cachix-cache-name
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
        continue-on-error: true

      - name: Run CI checks & Summary Report
        run: |
          # report をビルド (全チェックが並列実行され、結果が report_dir に入る)
          report_dir=$(nix build .#checks.x86_64-linux.report --no-link --print-out-paths)

          # GitHub Actions のサマリー画面に Markdown を出力
          cat "$report_dir/report.md" >> $GITHUB_STEP_SUMMARY

          # 検査に失敗していた場合はここで GitHub Actions を落とす
          if [ -f "$report_dir/failed" ]; then
            echo "CI checks failed. Please see the summary above."
            exit 1
          fi

      - name: statix
        run: nix run nixpkgs#statix -- check . || true

      - name: deadnix
        run: nix run nixpkgs#deadnix -- --fail . || true
